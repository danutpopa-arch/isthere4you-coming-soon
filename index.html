var PREFIX = "i4y_";
function loadJSON(key, fallback){
  try{
    var raw = window.localStorage.getItem(PREFIX + key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(err){ console.error("Citire storage esuata", err); return fallback; }
}
function saveJSON(key, value){
  try{ window.localStorage.setItem(PREFIX + key, JSON.stringify(value)); }
  catch(err){ console.error("Scriere storage esuata", err); }
}

/* ---------- componenta principala ---------- */
function App(){
  var langState=useState("ro"); var lang=langState[0], setLang=langState[1];
  var modalState=useState(null); var modal=modalState[0], setModal=modalState[1];

  var preregFormState=useState({email:"",consent:false,hp:""});
  var preregForm=preregFormState[0], setPreregForm=preregFormState[1];
  var preregDoneState=useState(false); var preregDone=preregDoneState[0], setPreregDone=preregDoneState[1];
  var preregEmailState=useState(""); var preregEmail=preregEmailState[0], setPreregEmail=preregEmailState[1];
  var preregErrState=useState(""); var preregErr=preregErrState[0], setPreregErr=preregErrState[1];
  var preregLoadingState=useState(false); var preregLoading=preregLoadingState[0], setPreregLoading=preregLoadingState[1];

  var contactFormState=useState({name:"",email:"",subject:"",message:"",hp:""});
  var contactForm=contactFormState[0], setContactForm=contactFormState[1];
  var contactConsentState=useState(false); var contactConsent=contactConsentState[0], setContactConsent=contactConsentState[1];
  var contactDoneState=useState(false); var contactDone=contactDoneState[0], setContactDone=contactDoneState[1];
  var contactErrState=useState(""); var contactErr=contactErrState[0], setContactErr=contactErrState[1];
  var contactLoadingState=useState(false); var contactLoading=contactLoadingState[0], setContactLoading=contactLoadingState[1];

  var preregTokenRef=React.useRef("");
  var preregWidgetRef=React.useRef(null);
  var preregNodeRef=React.useRef(null);
  var pendingPreregRef=React.useRef(null);
  var contactTokenRef=React.useRef("");
  var contactWidgetRef=React.useRef(null);
  var contactNodeRef=React.useRef(null);
  var pendingContactRef=React.useRef(null);

  var t=STR[lang];

  function renderPreregTurnstile(){
    if(!window.turnstile || !preregNodeRef.current || preregWidgetRef.current!==null) return;
    preregWidgetRef.current=window.turnstile.render(preregNodeRef.current,{
      sitekey:TURNSTILE_SITE_KEY, theme:"light", appearance:"interaction-only", execution:"execute", action:"prelaunch_signup",
      callback:function(token){
        preregTokenRef.current=token;
        var payload=pendingPreregRef.current;
        if(payload){ pendingPreregRef.current=null; sendPrereg(payload,token); }
      },
      "expired-callback":function(){ preregTokenRef.current=""; },
      "error-callback":function(){ preregTokenRef.current=""; pendingPreregRef.current=null; setPreregLoading(false); setPreregErr(STR[lang].verificationError); return true; }
    });
  }

  function renderContactTurnstile(){
    if(!window.turnstile || !contactNodeRef.current || contactWidgetRef.current!==null) return;
    contactWidgetRef.current=window.turnstile.render(contactNodeRef.current,{
      sitekey:TURNSTILE_SITE_KEY, theme:"light", appearance:"interaction-only", execution:"execute", action:"contact_message",
      callback:function(token){
        contactTokenRef.current=token;
        var payload=pendingContactRef.current;
        if(payload){ pendingContactRef.current=null; sendContact(payload,token); }
      },
      "expired-callback":function(){ contactTokenRef.current=""; },
      "error-callback":function(){ contactTokenRef.current=""; pendingContactRef.current=null; setContactLoading(false); setContactErr(STR[lang].verificationError); return true; }
    });
  }

  useEffect(function(){ loadTurnstileScript(renderPreregTurnstile); },[]);
  useEffect(function(){
    if(modal!=="contact") return;
    var timer=setTimeout(function(){ loadTurnstileScript(renderContactTurnstile); },0);
    return function(){ clearTimeout(timer); };
  },[modal]);

  function resetPreregTurnstile(){
    preregTokenRef.current="";
    if(window.turnstile && preregWidgetRef.current!==null){ try{ window.turnstile.reset(preregWidgetRef.current); }catch(e){} }
  }
  function resetContactTurnstile(){
    contactTokenRef.current="";
    if(window.turnstile && contactWidgetRef.current!==null){ try{ window.turnstile.reset(contactWidgetRef.current); }catch(e){} }
  }

  async function sendPrereg(payload,token){
    try{
      var res=await fetch(PRELAUNCH_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({},payload,{turnstileToken:token}))});
      var data={}; try{ data=await res.json(); }catch(e){}
      if(res.ok && data.ok){ setPreregEmail(payload.email); setPreregDone(true); setPreregErr(""); return; }
      resetPreregTurnstile();
      if(data && (data.error==="turnstile_failed"||data.error==="turnstile_required"||data.error==="verification_unavailable")) setPreregErr(STR[lang].verificationError);
      else setPreregErr(STR[lang].errGeneric);
    }catch(err){ console.error(err); resetPreregTurnstile(); setPreregErr(STR[lang].errGeneric); }
    finally{ setPreregLoading(false); }
  }

  async function submitPrereg(){
    var email=preregForm.email.trim().toLowerCase();
    if(!isValidEmail(email)){ setPreregErr(t.errEmail); return; }
    if(!preregForm.consent){ setPreregErr(t.errConsent); return; }
    if(preregForm.hp && preregForm.hp.trim()!==""){ setPreregDone(true); setPreregEmail(email); setPreregErr(""); return; }
    var elapsed=Date.now()-pageLoadedAt;
    if(elapsed<MIN_HUMAN_TIME_MS) await new Promise(function(resolve){ setTimeout(resolve,MIN_HUMAN_TIME_MS-elapsed); });
    setPreregLoading(true); setPreregErr("");
    var payload={email:email,language:lang,launchConsent:true,termsAccepted:true,privacyAcknowledged:true,website:preregForm.hp};
    if(!window.turnstile || preregWidgetRef.current===null){ setPreregLoading(false); setPreregErr(t.verificationError); return; }
    if(preregTokenRef.current){ sendPrereg(payload,preregTokenRef.current); return; }
    pendingPreregRef.current=payload;
    try{ window.turnstile.execute(preregWidgetRef.current); }
    catch(err){ console.error(err); pendingPreregRef.current=null; setPreregLoading(false); setPreregErr(t.verificationError); }
  }

  async function sendContact(payload,token){
